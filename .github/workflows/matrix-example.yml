name: Matrix Demo

on:
  pull_request:
    branches:
      - main

jobs:
  example_matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
        what: [toolbox, jupyterlab, api, api-with-migration]
    steps:
      - name: Show matrix combination
        run: echo pixi run deploy-${{ matrix.what }}-${{ matrix.env }}
        if: ${{ matrix.env == "staging" }}
