name: Matrix Demo

on:
  pull_request:
    branches:
      - main

jobs:
  example_matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [1, 2]
        what: [toolbox, jupyterlab, api, api-with-migration]
    steps:
      - name: Show matrix combination
        run: echo pixi run deploy-${{ matrix.what }}-${{ matrix.environment }}
        if: ${{ matrix.environment }} == 1
